<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">

  <title>Private Browser V2</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- TOP BAR -->
    <header class="topbar">

      <div class="toolbar">

        <button class="icon-btn" id="back" title="Back">
          ‹
        </button>

        <button class="icon-btn" id="forward" title="Forward">
          ›
        </button>

        <button class="icon-btn" id="reload" title="Reload">
          ↻
        </button>

        <button class="icon-btn" id="homeBtn" title="Home">
          ⌂
        </button>

        <div class="address-wrap">

          <span class="lock">
            🔒
          </span>

          <input
            id="address"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search or enter a web address"
          >

          <button class="go-btn" id="go">
            Go
          </button>

        </div>

        <button class="icon-btn" id="newTab" title="New Tab">
          ＋
        </button>

        <button class="icon-btn" id="settingsBtn" title="Settings">
          ⚙
        </button>

      </div>

      <!-- TABS -->
      <div class="tabs" id="tabs"></div>

    </header>

    <!-- PAGE CONTENT -->
    <main class="content" id="content"></main>

    <!-- STATUS -->
    <div class="status">
      🕵️ Private Browser V2
    </div>

  </div>

  <!-- SETTINGS MODAL -->
  <div class="modal" id="settingsModal">

    <div class="modal-box">

      <div class="modal-header">

        <h2>
          Browser Settings
        </h2>

        <button
          class="close-btn"
          id="closeSettings"
        >
          ✕
        </button>

      </div>

      <div class="settings-content">

        <div class="setting-row">

          <div>
            <strong>
              Theme
            </strong>

            <p>
              Switch between dark and light mode.
            </p>
          </div>

          <button
            class="setting-button"
            id="themeToggle"
          >
            🌙
          </button>

        </div>

        <div class="setting-row">

          <div>
            <strong>
              Clear Session
            </strong>

            <p>
              Close all tabs and reset the browser.
            </p>
          </div>

          <button
            class="danger-button"
            id="clearSession"
          >
            Clear
          </button>

        </div>

        <div class="about">

          <strong>
            Private Browser V2
          </strong>

          <p>
            A GitHub-hosted browser interface.
          </p>

          <p>
            V2 is a browser shell and does not
            provide VPN-level anonymity.
          </p>

        </div>

      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
